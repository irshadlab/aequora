[package]
name = "aequora-cli"
default-run = "aequora"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Payload-free adapter diagnostics and verification for Aequora"
repository.workspace = true

[[bin]]
name = "aequora"
path = "src/main.rs"
doc = false

[[example]]
name = "generated_client_starter"
path = "templates/client.rs"

[[example]]
name = "generated_server_starter"
path = "templates/server.rs"

[dependencies]
clap.workspace = true
clap_complete.workspace = true
clap_mangen.workspace = true
aequora-protocol = { version = "0.1.1", path = "../aequora-protocol" }
aequora-registry = { version = "0.1.1", path = "../aequora-registry", features = ["codegen"] }
aequora-testkit = { version = "0.1.1", path = "../aequora-testkit" }
serde_json.workspace = true
aequora-authority = { version = "0.1.1", path = "../aequora-authority" }
aequora-config = { version = "0.1.1", path = "../aequora-config" }
aequora-diagnostics = { version = "0.1.1", path = "../aequora-diagnostics" }
aequora-deployment = { version = "0.1.1", path = "../aequora-deployment" }
aequora-store = { version = "0.1.1", path = "../aequora-store" }
aequora-store-postgres = { version = "0.1.1", path = "../aequora-store-postgres" }
aequora-store-sqlite = { version = "0.1.1", path = "../aequora-store-sqlite" }
aequora-store-stoolap = { version = "0.1.1", path = "../aequora-store-stoolap" }
aequora-supply-chain = { version = "0.1.1", path = "../aequora-supply-chain" }
aequora-observability = { version = "0.1.1", path = "../aequora-observability" }
aequora-release = { version = "0.1.1", path = "../aequora-release" }
aequora-types = { version = "0.1.1", path = "../aequora-types" }
aequora-security = { version = "0.1.1", path = "../aequora-security" }
aequora-workload = { version = "0.1.1", path = "../aequora-workload" }
hex.workspace = true
ron.workspace = true
serde.workspace = true
tempfile.workspace = true
thiserror.workspace = true

[dev-dependencies]
aequora = { version = "0.1.1", path = "../aequora" }

[features]
test-failpoints = []

[lints]
workspace = true
