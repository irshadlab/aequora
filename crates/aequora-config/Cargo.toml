[package]
name = "aequora-config"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description.workspace = true
repository.workspace = true

[features]
default = []
axum = ["dep:aequora-axum"]
http-client = ["dep:aequora-http"]
quic = ["dep:aequora-quic"]
test-facilities = []

[dependencies]
secrecy.workspace = true
zeroize.workspace = true
aequora-adapter-sdk = { version = "0.1.1", path = "../aequora-adapter-sdk" }
blake3.workspace = true
aequora-authority = { version = "0.1.1", path = "../aequora-authority" }
aequora-security = { version = "0.1.1", path = "../aequora-security", features = ["crypto"] }
aequora-axum = { version = "0.1.1", path = "../aequora-axum", optional = true }
aequora-client = { version = "0.1.1", path = "../aequora-client" }
aequora-compute = { version = "0.1.1", path = "../aequora-compute" }
aequora-types = { version = "0.1.1", path = "../aequora-types" }
aequora-http = { version = "0.1.1", path = "../aequora-http", optional = true }
aequora-observability = { version = "0.1.1", path = "../aequora-observability" }
aequora-quic = { version = "0.1.1", path = "../aequora-quic", optional = true }
aequora-protocol = { version = "0.1.1", path = "../aequora-protocol" }
aequora-server = { version = "0.1.1", path = "../aequora-server" }
postcard.workspace = true
ron.workspace = true
serde.workspace = true
thiserror.workspace = true

[lints]
workspace = true
